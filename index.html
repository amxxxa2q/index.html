<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      background: black;
      font-family: Birch;
      color: white;

      display: flex;
      flex-direction: column;
      align-items: center;

      height: 50vh;
      margin: 0;
      padding-top: 80px;
    }

    .box {
      width: 320px;
      height: 420px;
      background: grey;

      border-radius: 20px;
      border: 5px solid grey;

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;

      margin-top: 20px;
      gap: 10px;
    }

    button {
      padding: 15px;
      cursor: pointer;
      border-radius: 8px;
      border: none;
    }
  </style>
</head>

<body>

  <!-- LOGIN -->
  <h2>Login</h2>

  <button onclick="loginGoogle()">Sign in with Google<(not working)</button>
  <button onclick="logout()">Logout</button>

  <p id="user">Not logged in</p>

  <!-- VOTING -->
  <div class="box">
    <h1>Is Miqy Gay?</h1>
    <p>choose yes or no</p>

    <button onclick="vote('yes')">yes</button>
    <button onclick="vote('no')">no</button>

    <h3 id="result">Loading.</h3>
  </div>

  <!-- SUPABASE -->
  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

    const supabase = createClient(
      "https://rvkvzzyzputxmqnsfvhv.supabase.co",
      "YOUR_SUPABASE_ANON_KEY"
    );

    let user = null;

    // LOGIN
    window.loginGoogle = async function () {
      await supabase.auth.signInWithOAuth({
        provider: "google",
        options: {
          redirectTo: "https://v32x.com"
        }
      });
    };

    // LOGOUT
    window.logout = async function () {
      await supabase.auth.signOut();
      location.reload();
    };

    // GET USER
    async function getUser() {
      const { data } = await supabase.auth.getUser();

      if (data.user) {
        user = data.user;
        document.getElementById("user").innerText =
          "Logged in as: " + user.email;

        loadVotes();
      }
    }

    getUser();

    // VOTE
    window.vote = async function (type) {
      if (!user) {
        alert("Please log in first");
        return;
      }

      // check if already voted
      const { data: existing } = await supabase
        .from("votes")
        .select("*")
        .eq("user_id", user.id)
        .single();

      if (existing) {
        alert("You already voted");
        return;
      }

      await supabase.from("votes").insert([
        {
          user_id: user.id,
          vote: type
        }
      ]);

      loadVotes();
    };

    // LOAD RESULTS
    async function loadVotes() {
      const { data } = await supabase.from("votes").select("*");

      if (!data) return;

      const yes = data.filter(v => v.vote === "yes").length;
      const no = data.filter(v => v.vote === "no").length;

      document.getElementById("result").innerText =
        `Yes: ${yes} | No: ${no}`;
    }
  </script>

</body>
</html>

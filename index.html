<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Vote yes</title>

  <style>

    body {
      background: rgb(145, 141, 141);
      font-family: Arial, sans-serif;
      color: white;

      display: flex;
      flex-direction: column;
      align-items: center;

      min-height: 100vh;
      margin: 0;
      padding-top: 60px;
    }

    .box {
      width: 320px;
      height: 420px;
      background: rgb(193, 201, 209);

      border-radius: 20px;
      border: 5px solid rgb(4, 131, 124);

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;

      text-align: center;
      gap: 12px;

      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
      margin-top: 20px;
    }

    button {
      padding: 12px 20px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-size: 16px;
      transition: 0.2s;

      background: whitesmoke;
      color: rgb(80, 80, 80);

      margin: 5px;
    }

    button:hover {
      transform: scale(1.05);
    }

    .button2 {
      margin-top: 10px;
    }

  </style>
</head>

<body>

  <h2>Login</h2>

  <button class="button2" onclick="loginGoogle()">
    Sign in with Google
  </button>

  <button class="button2" onclick="logout()">
    Logout
  </button>

  <p id="user">Not logged in</p>

  <div class="box">

    <h1>Is Miqy Gay?</h1>
    <p>Choose yes or no</p>

    <button onclick="vote('yes')">Yes</button>
    <button onclick="vote('no')">No</button>

    <h3 id="result">Loading...</h3>

  </div>

  <script type="module">

    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

    /* =========================
       SUPABASE SETUP
    ========================== */

    const supabase = createClient(
      "https://rvkvzzyzputxmqnsfvhv.supabase.co",
      "YOUR_SUPABASE_ANON_KEY"
    );

    let user = null;

    /* =========================
       LOGIN
    ========================== */

    window.loginGoogle = async function () {
      const { error } = await supabase.auth.signInWithOAuth({
        provider: "google",
        options: {
          redirectTo: window.location.origin
        }
      });

      if (error) console.error(error.message);
    };

    /* =========================
       LOGOUT
    ========================== */

    window.logout = async function () {
      await supabase.auth.signOut();
      location.reload();
    };

    /* =========================
       GET USER
    ========================== */

    async function getUser() {
      const { data, error } = await supabase.auth.getUser();

      if (error) {
        console.error(error.message);
        return;
      }

      if (data?.user) {
        user = data.user;

        document.getElementById("user").innerText =
          "Logged in as: " + user.email;

        loadVotes();
      }
    }

    getUser();

    /* =========================
       VOTE
    ========================== */

    window.vote = async function (type) {

      if (!user) {
        alert("Please log in first");
        return;
      }

      const { data: existing, error } = await supabase
        .from("votes")
        .select("*")
        .eq("user_id", user.id)
        .maybeSingle();

      if (error) {
        console.error(error.message);
        return;
      }

      if (existing) {
        alert("You already voted");
        return;
      }

      const { error: insertError } = await supabase
        .from("votes")
        .insert([
          {
            user_id: user.id,
            vote: type
          }
        ]);

      if (insertError) {
        console.error(insertError.message);
        return;
      }

      loadVotes();
    };

    /* =========================
       LOAD VOTES
    ========================== */

    async function loadVotes() {

      const { data, error } = await supabase
        .from("votes")
        .select("*");

      if (error) {
        console.error(error.message);
        return;
      }

      const yes = data.filter(v => v.vote === "yes").length;
      const no = data.filter(v => v.vote === "no").length;

      document.getElementById("result").innerText =
        `Yes: ${yes} | No: ${no}`;
    }

  </script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      background: black;
      font-family: Birch;
      color: white;

      display: flex;
      justify-content: flex-start;
      padding-top: 80px;
      align-items: center;

      height: 100vh;
      margin: 0;
    }

    .box {
      width: 320px;
      height: 420px;
      background: grey;
      margin-top: 50px;
      border-radius: 20px;
      border: 5px solid white;

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    h1 {
      font-size: 3rem;
      margin: 0;
    }

    p {
      margin: 10px 0 0 0;
      font-size: 1.2rem;
    }
  </style>
</head>

<body>

  <div class="box">
    <h1>fuck u</h1>
    <p>especially you eric.</p>
  </div>

</body>
</html>
